name: cityeat

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cityeat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityeat}
      POSTGRES_DB: cityeat
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityeat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cityeat:${POSTGRES_PASSWORD:-cityeat}@db:5432/cityeat
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-3100}:3000"
    volumes:
      - uploads:/data/uploads
    profiles: ["app"]

volumes:
  pgdata:
  uploads:
